<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <style>
      .t { font: 700 38px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
      .d { font: 400 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #bcdfee; }
      .shine { animation: shine 4s linear infinite; }
      @keyframes shine { from { transform: translateX(-300px); } to { transform: translateX(1500px); } }
    </style>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="130" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="130" fill="url(#g)"/>
    <rect class="shine" x="0" y="0" width="200" height="130" fill="url(#s)"/>
  </g>
  <text x="600" y="62" text-anchor="middle" class="t">OWL · OWASP Web Shield Library</text>
  <text x="600" y="98" text-anchor="middle" class="d">Security controls as natural as any other dependency</text>
</svg>
