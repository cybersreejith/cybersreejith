<svg xmlns="http://www.w3.org/2000/svg" width="350" height="130" viewBox="0 0 350 130">
<style>
.t{font:600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#70a5fd} .l{font:400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#c0caf5} .v{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#c0caf5}
.s{font:400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#c0caf5} .row{animation:f .6s ease-out both}
@keyframes f{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion){.row{animation:none}}
</style>
<rect x="0.5" y="0.5" width="349" height="129" rx="10" fill="#1a1b27" stroke="#2c5364"/>
<text x="25" y="35" class="t">Most Used Languages</text>
<clipPath id="m"><rect x="25" y="55" width="300" height="8" rx="4"/></clipPath><g clip-path="url(#m)">
<rect x="25.00" y="55" width="227.58" height="8" fill="#3572A5"/>
<rect x="252.08" y="55" width="73.42" height="8" fill="#b07219"/>
</g>
<g class="row" style="animation-delay:0ms"><circle cx="30" cy="86" r="5" fill="#3572A5"/><text x="41" y="90" class="s">Python 75.7%</text></g>
<g class="row" style="animation-delay:100ms"><circle cx="190" cy="86" r="5" fill="#b07219"/><text x="201" y="90" class="s">Java 24.3%</text></g>
</svg>