name: Update profile images

on:
  schedule:
    - cron: "0 * * * *"      # hourly (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "assets/stats.svg"
      - "assets/trophies.svg"
      - "assets/top-langs.svg"
      - "assets/streak.svg"
      - "assets/activity-graph.svg"
      - "assets/repo-*.svg"
      - "assets/github-snake*.svg"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The contribution calendar lags a few minutes behind a push; wait so this run sees the new commit.
      - name: Wait for contribution calendar to catch up
        if: github.event_name == 'push'
        run: sleep 180

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats, languages, streak, activity and repo cards
        run: python scripts/generate_cards.py
        env:
          # PROFILE_TOKEN (a PAT with read:user) includes private contributions; falls back to the Actions token.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit updated images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: refresh profile images"
          git pull --rebase
          git push
