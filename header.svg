<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#7ee8fa"/>
    </linearGradient>
    <style>
      .title { font: 700 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .sub   { font: 500 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #cfe8f3; letter-spacing: 1px; }
      .fade  { animation: fadeIn 1.2s ease-out both; }
      .fade2 { animation: fadeIn 1.2s ease-out 0.5s both; }
      .wave1 { animation: drift 9s ease-in-out infinite alternate; }
      .wave2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drift  { from { transform: translateX(0); } to { transform: translateX(-120px); } }
      @keyframes pulse  { 0%,100% { opacity: .25; } 50% { opacity: .6; } }
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- subtle network dots -->
  <g fill="#36BCF7" class="pulse">
    <circle cx="90" cy="50" r="3"/><circle cx="170" cy="95" r="2"/><circle cx="1060" cy="60" r="3"/>
    <circle cx="1120" cy="120" r="2"/><circle cx="980" cy="35" r="2"/><circle cx="240" cy="40" r="2"/>
  </g>
  <g stroke="#36BCF7" stroke-width="1" opacity=".25">
    <line x1="90" y1="50" x2="170" y2="95"/><line x1="170" y1="95" x2="240" y2="40"/>
    <line x1="980" y1="35" x2="1060" y2="60"/><line x1="1060" y1="60" x2="1120" y2="120"/>
  </g>

  <!-- waves -->
  <g class="wave2">
    <path d="M0 215 Q 150 180 300 210 T 600 210 T 900 210 T 1200 210 T 1500 210 V260 H0 Z" fill="#36BCF7" opacity=".12"/>
  </g>
  <g class="wave1">
    <path d="M0 230 Q 150 200 300 228 T 600 228 T 900 228 T 1200 228 T 1500 228 V260 H0 Z" fill="#7ee8fa" opacity=".18"/>
  </g>

  <!-- text -->
  <g class="fade">
    <text x="600" y="112" text-anchor="middle" class="title">Hi, I'm Sreejith</text>
  </g>
  <rect x="520" y="130" width="160" height="4" rx="2" fill="url(#accent)" class="fade2"/>
  <g class="fade2">
    <text x="600" y="168" text-anchor="middle" class="sub">Full Stack Developer  •  Technical Lead  •  Identity &amp; Access Management</text>
  </g>
</svg>
